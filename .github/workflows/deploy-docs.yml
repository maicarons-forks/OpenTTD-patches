name: Build Docs

on:
  push:
    branches: [px-patch]
    paths:
      - "pxp-docs/**"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: ./pxp-docs

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pxp-docs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Convert Typst sources to Markdown
        run: python3 ../tools/convert_typst_to_md.py

      - name: Build docs
        run: npm run docs:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ github.workspace }}/pxp-docs/.vitepress/dist

  deploy:
    needs: build-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
